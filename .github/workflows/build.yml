name: build
on: [workflow_dispatch, push]
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: install sing-box
        run: |
          url=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.assets[] | select(.name | endswith("linux-amd64.tar.gz")) | .browser_download_url' | head -1)
          curl -fsSL "$url" -o /tmp/sing-box.tgz
          tar -xzf /tmp/sing-box.tgz -C /tmp
          sudo install /tmp/sing-box-*/sing-box /usr/local/bin/sing-box
      - run: sing-box version
      - run: python -m unittest discover -s tests
      - run: python scripts/build.py examples/my-rules.yaml
      - name: validate generated artifacts
        run: |
          python -m json.tool dist/report.json >/dev/null
          python -m json.tool dist/semantic-audit.json >/dev/null
          python -m json.tool dist/memory-benchmark.json >/dev/null
          test "$(find dist/source -name '*.json' | wc -l | tr -d ' ')" = 7
          test "$(find dist/srs -name '*.srs' | wc -l | tr -d ' ')" = 7
          test "$(python -c 'import json; print(json.load(open("dist/report.json"))["providers"])')" = 53
          test "$(python -c 'import json; print(json.load(open("dist/report.json"))["groups"])')" = 7
          test "$(python -c 'import json; print(json.load(open("dist/report.json"))["unsupported_rules"])')" = 0
          test "$(python -c 'import json; print(json.load(open("dist/semantic-audit.json"))["failed"])')" = 0
          test "$(python -c 'import json; x=json.load(open("dist/semantic-audit.json")); print(x["passed"] == x["total"])')" = True
          test "$(python -c 'import json; x=json.load(open("dist/memory-benchmark.json")); print(x["rss_comparable"] and x["optimized"]["max_rss"] < x["legacy"]["max_rss"])')" = True
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: update generated sing-box SRS"
          file_pattern: dist
